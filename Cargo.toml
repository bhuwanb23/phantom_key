[package]
name = "phantom-key"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Phantom Key v2: Dealerless threshold key with sealed vault for secure LLM prompt processing"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cryptography", "threshold", "llm", "security", "vault"]
categories = ["cryptography", "security"]

[dependencies]
# Cryptography
curve25519-dalek = { version = "4.0", features = ["ristretto", "serde"] }
ed25519-dalek = "2.0"
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
zeroize = { version = "1.6", features = ["derive"] }

# Encryption
chacha20poly1305 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async
tokio = { version = "1.0", features = ["full"] }

# HTTP
reqwest = { version = "0.11", features = ["json"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI
ratatui = "0.20"
crossterm = "0.26"

# Other
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.8"
lazy_static = "1.4"
urlencoding = "2.1"
base64 = "0.21"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
criterion = "0.4"
proptest = "1.0"
mockito = "1.0"

[[bin]]
name = "phantom-key"
path = "src/main.rs"
